services:
  web:
    image: python:3.12-slim
    labels:
      base44.project: "Nima"
      base44.kind: web
      base44.port: "3000"
    working_dir: /app
    # Static site: the handler reads files from the bind mount on every request,
    # so source edits are served immediately (reload the page to see them).
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0", "--directory", "/app"]
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
      - BASE44_PREVIEW_MODE
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
