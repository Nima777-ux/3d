name: nima-portfolio

services:
  # One-shot dependency install into the shared node_modules volume.
  install:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ['sh', '-ec', 'npm ci --no-audit --no-fund']
    restart: 'no'

  # Contact-form backend: stores messages and (optionally) emails them.
  api:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: '8000'
      MESSAGE_STORE_DIR: /app/data
      BASE44_PREVIEW_MODE:
    env_file:
      # Platform-managed secrets (out of repo). Optional so the stack can boot without them.
      - path: /run/base44/app.env
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./data:/app/data
    command: ['node', '--watch', 'server/index.mjs']
    depends_on:
      install:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      base44.project: Nima Portfolio
      base44.kind: api

  # Vite dev server — serves the SPA on host port 3000 and proxies /api to the api service.
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      NODE_ENV: development
      BASE44_PREVIEW_MODE:
      BASE44_SANDBOX_HOST_DOMAIN:
      BASE44_PUBLIC_HOST_SUFFIX:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '3000:5173'
    command: ['sh', '-ec', 'exec npx vite --host 0.0.0.0 --port 5173']
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      base44.project: Nima Portfolio
      base44.kind: web
      base44.port: '3000'

volumes:
  node_modules:
